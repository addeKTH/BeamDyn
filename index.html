<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Railway bridge dynamics &mdash; BeamDyn2D</title>
<style>
:root{
  --bg:#f7f7f5; --panel:#fff; --ink:#1c1c1a; --mute:#6b6b66; --line:#d8d8d2;
  --accent:#8b2500; --ok:#1f6f3f;
  --c1:#0072b2; --c2:#d55e00; --c3:#009e73; --c4:#cc79a7; --c5:#56b4e9; --c6:#e69f00;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:18px 16px 40px}
header{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
h1{font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em}
header .sub{color:var(--mute);font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px}

/* ---- inputs ---- */
.inputs{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.group h3{margin:0 0 8px;font-size:12px;font-weight:600}
.f{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.f label{width:78px;color:var(--mute);flex:none;font-size:12px}
.f input,.f select{flex:1;min-width:0;padding:3px 6px;font:inherit;font-size:12px;
  border:1px solid var(--line);border-radius:3px;background:#fff;color:var(--ink)}
.f input:focus,.f select:focus{outline:2px solid var(--c1);outline-offset:-1px;border-color:var(--c1)}
.f input.bad{border-color:var(--accent);background:#fff5f2}
.f input:disabled{background:#f2f2ef;color:#a9a9a4}

/* ---- bar ---- */
.bar{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:12px;
  border-top:1px solid var(--line)}
button{padding:5px 13px;font:inherit;font-size:12px;border:1px solid var(--line);
  border-radius:4px;background:#fff;color:var(--ink);cursor:pointer}
button:hover:not(:disabled){background:#f0f0ec;border-color:#b8b8b2}
button:disabled{opacity:.4;cursor:default}
button.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
button.pri:hover:not(:disabled){background:#000}
#msg{font-size:12px;color:var(--accent);min-width:110px}
#msg.ok{color:var(--ok)}
.spacer{flex:1}
.hint{font-size:11px;color:var(--mute)}

/* ---- plots ---- */
.plots{margin-top:14px}
svg{display:block;width:100%;height:auto;overflow:visible}
.ax{stroke:var(--ink);stroke-width:.8;fill:none}
.gr{stroke:var(--line);stroke-width:.5;fill:none}
.tk{font-size:9px;fill:var(--mute)}
.lb{font-size:10px;fill:var(--ink)}
.sup{cursor:pointer}
.sup:hover .hit{fill:rgba(139,37,0,.16)}
.pick text{font-size:9px;fill:var(--ink)}
.pick rect{fill:#fff;stroke:var(--line);stroke-width:.6}
.lgd{font-size:9px;fill:var(--ink)}
#pop{position:absolute;z-index:9;background:#fff;border:1px solid var(--line);
  border-radius:4px;padding:3px;display:none;box-shadow:0 3px 10px rgba(0,0,0,.13)}
#pop button{display:block;width:100%;text-align:left;border:0;padding:4px 12px;font-size:12px}
footer{margin-top:22px;color:var(--mute);font-size:11px;text-align:center}
#rep{display:none}

/* ---- print: one A4 page ---- */
@media print{
  body{background:#fff}
  .wrap{max-width:none;padding:0}
  .bar,.hint,footer,header .sub{display:none}
  .card{border:0;padding:0}
  .inputs{gap:10px}
  #rep{display:block;margin:10px 0 4px;font-size:11px}
  #rep td{padding:1px 10px 1px 0}
  #rep .h{font-weight:600;border-bottom:1px solid #000}
  .plots svg{page-break-inside:avoid}
  @page{size:A4 portrait;margin:16mm}
}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>Railway bridge dynamics</h1>
  <span class="sub">multi-span Bernoulli&ndash;Euler beam &middot; moving constant forces</span>
</header>

<div class="card">
  <div class="inputs">
    <div class="group">
      <h3>Bridge properties</h3>
      <div class="f"><label>L (m)</label><input id="iL" value="20 20"></div>
      <div class="f"><label>m (kg/m)</label><input id="im" value="15E3"></div>
      <div class="f"><label>EI (Nm²)</label><input id="iEI" value="30E9"></div>
      <div class="f"><label>ξ (%)</label><input id="ixi" value="1.5"></div>
    </div>
    <div class="group">
      <h3>Analysis</h3>
      <div class="f"><label>N<sub>mod</sub></label><input id="iNmod" value="3"></div>
      <div class="f"><label>f<sub>max</sub> (Hz)</label><input id="ifmax" value="30"></div>
      <div class="f"><label>dL (m)</label><input id="idL" value="1"></div>
    </div>
    <div class="group">
      <h3>Train</h3>
      <div class="f"><label>load</label><select id="iload"></select></div>
      <div class="f"><label>cars</label><input id="iNcar" value="20"></div>
      <div class="f"><label>v (km/h)</label><input id="iv" value="100:1:200"></div>
      <div class="f"><label>W (m)</label><input id="iW" value="0"></div>
    </div>
  </div>

  <div class="bar">
    <button id="bRun" class="pri">Run</button>
    <button id="bSave" disabled>Save</button>
    <button id="bClear">Clear</button>
    <button id="bReset">Reset</button>
    <button id="bRep" disabled>Report</button>
    <span id="msg"></span>
    <span class="spacer"></span>
    <span class="hint">click a support to set pinned / clamped &middot; click a curve to pick a point</span>
  </div>
</div>

<table id="rep"></table>

<div class="plots">
  <svg id="sBeam"  viewBox="0 0 640 92"></svg>
  <svg id="sModes" viewBox="0 0 640 176"></svg>
  <svg id="sDmax"  viewBox="0 0 640 150"></svg>
  <svg id="sAmax"  viewBox="0 0 640 176"></svg>
</div>
<footer>Last updated 2026-07-30 </footer>
</div>

<div id="pop">
  <button data-v="0">pinned</button>
  <button data-v="1">clamped</button>
</div>

<script src="beamdyn.js"></script>
<script src="xlsx.js"></script>
<script>
'use strict';
const B = window.BeamDyn;
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const COL = ['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)','var(--c6)'];

/* ---------- geometry: beam and modes share ML/MR so supports line up ------ */
const ML = 52, MR = 14;
const GEO = {
  beam : {svg:'sBeam' , w:640, h:92 , t:6 , b:6 },
  modes: {svg:'sModes', w:640, h:176, t:10, b:30},
  dmax : {svg:'sDmax' , w:640, h:150, t:10, b:8 },
  amax : {svg:'sAmax' , w:640, h:176, t:10, b:30}
};

/* ---------- state -------------------------------------------------------- */
const DEF = {L:'20 20', m:'15E3', EI:'30E9', xi:'1.5', Nmod:'3', fmax:'30',
             dL:'1', load:'D2', Ncar:'20', v:'100:1:200', W:'0'};
let sup = [];            // per support: false = pinned, true = clamped
let mdl = null;          // current model (live)
let runs = [];           // accumulated results
let picks = [];          // {which:'d'|'a', run, i}
let busy = false;

/* ---------- input parsing ------------------------------------------------ */
function parseVec(s){
  s = String(s).trim(); if(!s) return [];
  if(s.includes(':')){
    const p = s.split(':').map(Number);
    if(p.some(isNaN)) return [];
    let a,b,c;
    if(p.length===2){a=p[0];b=1;c=p[1];} else if(p.length===3){a=p[0];b=p[1];c=p[2];} else return [];
    if(b===0) return [];
    const o=[]; for(let v=a; b>0? v<=c+1e-9 : v>=c-1e-9; v+=b) o.push(Math.round(v*1e9)/1e9);
    return o;
  }
  const o = s.split(/[\s,]+/).map(Number);
  return o.some(isNaN) ? [] : o;
}
const num = s => { const v = Number(String(s).trim()); return isNaN(v) ? null : v; };

function readInput(){
  const bad = [];
  const g = (id, f, ok) => {
    const el = $(id), v = f(el.value);
    const good = v !== null && v !== undefined && ok(v);
    el.classList.toggle('bad', !good);
    if(!good) bad.push(id);
    return v;
  };
  const inp = {};
  inp.L    = g('iL',    parseVec, v => v.length>0 && v.every(x=>x>0));
  inp.m    = g('im',    num, v => v>0);
  inp.EI   = g('iEI',   num, v => v>0);
  inp.xi   = g('ixi',   num, v => v>=0 && v<100);
  inp.Nmod = g('iNmod', num, v => v>=1 && v%1===0);
  inp.fmax = g('ifmax', num, v => v>0);
  inp.dL   = g('idL',   num, v => v>0);
  inp.N_car= g('iNcar', num, v => v>=1 && v%1===0);
  inp.v    = g('iv',    parseVec, v => v.length>0 && v.every(x=>x>0));
  inp.W    = g('iW',    num, v => v>=0);
  inp.load = $('iload').value;
  $('iNcar').disabled = inp.load === 'HSLM';
  if(bad.length){ msg('check input', false); return null; }
  return inp;
}

function buildBC(inp){
  const dL = inp.dL;
  const Ls = inp.L.map(x => dL*Math.round(x/dL));
  const xs = [0]; Ls.forEach(v => xs.push(xs[xs.length-1]+v));
  if(sup.length !== xs.length) sup = xs.map(()=>false);
  const bc = xs.map(x => [x,1]);
  xs.forEach((x,i) => { if(sup[i]) bc.push([x,2]); });
  return {bc, xs};
}

/* ---------- svg helpers -------------------------------------------------- */
function clear(id){ const s=$(id); while(s.firstChild) s.removeChild(s.firstChild); return s; }
function el(p,t,a){ const e=document.createElementNS(NS,t);
  for(const k in a) e.setAttribute(k,a[k]); p.appendChild(e); return e; }
function txt(p,x,y,s,cls,anchor){ const e=el(p,'text',{x,y,class:cls||'tk'});
  if(anchor) e.setAttribute('text-anchor',anchor); e.textContent=s; return e; }

function ticks(lo,hi,n){
  const span=hi-lo; if(!(span>0)) return [lo];
  const s0=span/(n||5), mag=Math.pow(10,Math.floor(Math.log10(s0))), r=s0/mag;
  const step = r<1.5?mag : r<3?2*mag : r<7?5*mag : 10*mag;
  const t=[]; for(let v=Math.ceil(lo/step-1e-9)*step; v<=hi+1e-9; v+=step) t.push(Math.round(v*1e9)/1e9);
  return t;
}
const fmt = v => Math.abs(v)>=1000||(v!==0&&Math.abs(v)<0.01) ? v.toExponential(1)
                 : String(Math.round(v*1000)/1000);

/* ---------- beam --------------------------------------------------------- */
function drawBeam(){
  const G = GEO.beam, s = clear(G.svg);
  if(!mdl) return;
  const Lt = mdl.Ltot, xs = mdl.xs;
  const x0 = -0.02*Lt, x1 = 1.02*Lt;
  const pw = G.w-ML-MR, ph = G.h-G.t-G.b;
  const X = v => ML + (v-x0)/(x1-x0)*pw;
  // equal data aspect comes from the y-limits, so x stays aligned with the modes
  const ysp = (x1-x0)*ph/pw, yc = -0.043*Lt;
  const Y = v => G.t + (yc+ysp/2 - v)/ysp*ph;

  el(s,'line',{x1:X(0),y1:Y(0),x2:X(Lt),y2:Y(0),stroke:'#9a9a94','stroke-width':4});

  xs.forEach((x,i)=>{
    const g = el(s,'g',{class:'sup'});
    if(sup[i]){                                            // clamped
      const w = .012*Lt, h = .030*Lt;
      el(g,'line',{x1:X(x),y1:Y(-h),x2:X(x),y2:Y(h),stroke:'#1c1c1a','stroke-width':1.2});
      const sgn = (i===xs.length-1)? 1 : -1;
      for(let k=-3;k<=3;k++){
        const y = k*h/3;
        el(g,'line',{x1:X(x),y1:Y(y),x2:X(x+sgn*w),y2:Y(y+h/3),
                     stroke:'#1c1c1a','stroke-width':.5});
      }
    }else{                                                 // pinned
      const a=.020*Lt, b=.030*Lt;
      el(g,'path',{d:`M${X(x)},${Y(0)} L${X(x-a)},${Y(-b)} L${X(x+a)},${Y(-b)} Z`,
                   fill:'none',stroke:'#1c1c1a','stroke-width':.9});
      el(g,'circle',{cx:X(x),cy:Y(0),r:2,fill:'#1c1c1a'});
    }
    const hit = el(g,'circle',{cx:X(x),cy:Y(0),r:9,fill:'transparent',class:'hit'});
    hit.addEventListener('click', ev => { ev.stopPropagation(); openPop(ev,i); });
    el(g,'title',{}).textContent = (sup[i]?'clamped':'pinned')+' — click to change';
  });

  // dimension line
  const yd = -0.10*Lt;
  el(s,'line',{x1:X(0),y1:Y(yd),x2:X(Lt),y2:Y(yd),class:'ax','stroke-width':.5});
  xs.forEach(x=>{
    el(s,'line',{x1:X(x),y1:Y(yd-.016*Lt),x2:X(x),y2:Y(yd+.04*Lt),class:'ax','stroke-width':.5});
    el(s,'line',{x1:X(x-.012*Lt),y1:Y(yd-.012*Lt),x2:X(x+.012*Lt),y2:Y(yd+.012*Lt),
                 class:'ax','stroke-width':.5});
  });
  for(let i=0;i<xs.length-1;i++)
    txt(s,(X(xs[i])+X(xs[i+1]))/2, Y(yd)-4, (xs[i+1]-xs[i]).toFixed(1), 'tk','middle');
}

/* ---------- generic axes ------------------------------------------------- */
function axes(G, xlim, ylim, xlab, ylab, noXlab){
  const s = clear(G.svg);
  const pw = G.w-ML-MR, ph = G.h-G.t-G.b;
  const X = v => ML + (v-xlim[0])/(xlim[1]-xlim[0])*pw;
  const Y = v => G.t + (ylim[1]-v)/(ylim[1]-ylim[0])*ph;
  el(s,'rect',{x:ML,y:G.t,width:pw,height:ph,fill:'none',stroke:'var(--line)','stroke-width':.8});
  ticks(xlim[0],xlim[1],6).forEach(v=>{
    if(v<xlim[0]-1e-9||v>xlim[1]+1e-9) return;
    el(s,'line',{x1:X(v),y1:G.t+ph,x2:X(v),y2:G.t+ph-3,class:'ax'});
    if(!noXlab) txt(s,X(v),G.t+ph+11,fmt(v),'tk','middle');
  });
  ticks(ylim[0],ylim[1],4).forEach(v=>{
    if(v<ylim[0]-1e-9||v>ylim[1]+1e-9) return;
    el(s,'line',{x1:ML,y1:Y(v),x2:ML+3,y2:Y(v),class:'ax'});
    txt(s,ML-5,Y(v)+3,fmt(v),'tk','end');
  });
  if(xlab && !noXlab) txt(s,ML+pw/2,G.h-3,xlab,'lb','middle');
  if(ylab){ const t=txt(s,0,0,ylab,'lb','middle');
    t.setAttribute('transform',`translate(12,${G.t+ph/2}) rotate(-90)`); }
  return {s,X,Y,pw,ph};
}
function polyline(s,X,Y,xs,ys,col,w){
  let d=''; for(let i=0;i<xs.length;i++) d += (i?'L':'M')+X(xs[i])+','+Y(ys[i]);
  return el(s,'path',{d,fill:'none',stroke:col,'stroke-width':w||1.2,
                      'stroke-linejoin':'round'});
}

/* ---------- mode shapes -------------------------------------------------- */
function drawModes(){
  if(!mdl){ clear(GEO.modes.svg); return; }
  const Lt = mdl.Ltot;
  const A = axes(GEO.modes, [-0.02*Lt, 1.02*Lt], [-1.1,1.1], 'x (m)', 'Φ(x)');
  const xs = [];
  for(let x=0;x<=Lt+1e-9;x+=mdl.dL/4) xs.push(Math.min(x,Lt));
  const P = B.hermiteEvalMany(mdl.Phi, mdl.nm, mdl.ndof, mdl.dL, mdl.EL, xs);
  for(let n=0;n<mdl.nm;n++){
    let mx=0; for(let j=0;j<xs.length;j++) mx=Math.max(mx,Math.abs(P[n*xs.length+j]));
    const ys=[]; for(let j=0;j<xs.length;j++) ys.push(P[n*xs.length+j]/mx);
    polyline(A.s,A.X,A.Y,xs,ys,COL[n%6]);
    const yy = GEO.modes.t+10+n*11;
    el(A.s,'line',{x1:ML+8,y1:yy,x2:ML+22,y2:yy,stroke:COL[n%6],'stroke-width':1.2});
    txt(A.s,ML+26,yy+3,`f${n+1} = ${mdl.f[n].toFixed(2)} Hz`,'lgd');
  }
}

/* ---------- envelopes ---------------------------------------------------- */
function envLim(which){
  let lo=Infinity, hi=-Infinity, ymax=0;
  runs.forEach(r=>{
    lo=Math.min(lo,...r.v); hi=Math.max(hi,...r.v);
    const e = env(r,which); e.forEach(v=>{ if(v>ymax) ymax=v; });
  });
  if(!runs.length) return null;
  return {xlim:[lo,hi], ylim:[0, Math.max(1.1*ymax,1e-12)]};
}
function env(r,which){
  const src = which==='d' ? r.dmax : r.amax;
  const n = r.v.length, o = new Float64Array(n);
  for(let i=0;i<n;i++){ let m=-Infinity; src.forEach(t=>{ if(t[i]>m) m=t[i]; });
    o[i] = which==='d' ? m*1e3 : m; }
  return o;
}
function drawEnv(which){
  const G = which==='d'?GEO.dmax:GEO.amax;
  const lab = which==='d'?'d_max (mm)':'a_max (m/s²)';
  const L = envLim(which);
  if(!L){ const A=axes(G,[100,200],[0,1],'v (km/h)',lab,which==='d'); return; }
  const A = axes(G, L.xlim, L.ylim, 'v (km/h)', lab, which==='d');
  runs.forEach((r,k)=>{
    const y = env(r,which);
    const p = polyline(A.s,A.X,A.Y,r.v,y,COL[k%6]);
    p.style.cursor='crosshair'; p.setAttribute('stroke-width',1.4);
    p.addEventListener('click', ev => pick(ev,which,k));
    el(p,'title',{}).textContent = r.label;
  });
  if(which==='a') runs.forEach((r,k)=>{
    const yy = G.t+10+k*11;
    el(A.s,'line',{x1:G.w-MR-88,y1:yy,x2:G.w-MR-74,y2:yy,stroke:COL[k%6],'stroke-width':1.4});
    txt(A.s,G.w-MR-70,yy+3,r.label,'lgd');
  });
  // picked points
  picks.filter(p=>p.which===which).forEach(p=>{
    const r=runs[p.run]; if(!r) return;
    const y=env(r,which), xv=r.v[p.i], yv=y[p.i];
    const px=A.X(xv), py=A.Y(yv);
    const g=el(A.s,'g',{class:'pick'});
    el(g,'circle',{cx:px,cy:py,r:3,fill:COL[p.run%6]});
    const s1 = `${xv.toFixed(0)} km/h`;
    const s2 = which==='d'?`${yv.toFixed(2)} mm`:`${yv.toFixed(3)} m/s²`;
    const wBox=58, right = px > ML+A.pw*0.7;
    const bx = right ? px-wBox-8 : px+8, by = Math.max(G.t+1, py-26);
    el(g,'rect',{x:bx,y:by,width:wBox,height:23,rx:2});
    txt(g,bx+4,by+9,s1); txt(g,bx+4,by+19,s2);
  });
}
function pick(ev,which,k){
  const G = which==='d'?GEO.dmax:GEO.amax;
  const r = runs[k];
  const box = $(G.svg).getBoundingClientRect();
  const L = envLim(which);
  const pw = G.w-ML-MR;
  const ux = (ev.clientX-box.left)/box.width*G.w;                 // to viewBox units
  const xv = L.xlim[0] + (ux-ML)/pw*(L.xlim[1]-L.xlim[0]);
  let bi=0, bd=Infinity;
  r.v.forEach((v,i)=>{ const d=Math.abs(v-xv); if(d<bd){bd=d;bi=i;} });
  if(!ev.shiftKey) picks = picks.filter(p=>p.which!==which);
  const j = picks.findIndex(p=>p.which===which&&p.run===k&&p.i===bi);
  if(j>=0) picks.splice(j,1); else picks.push({which,run:k,i:bi});
  drawEnv(which);
}

/* ---------- support popup ------------------------------------------------ */
function openPop(ev,i){
  const p=$('pop');
  p.style.left=(ev.pageX-14)+'px'; p.style.top=(ev.pageY+8)+'px'; p.style.display='block';
  p.dataset.i=i;
}
$('pop').addEventListener('click',ev=>{
  const b=ev.target.closest('button'); if(!b) return;
  sup[+$('pop').dataset.i] = b.dataset.v==='1';
  $('pop').style.display='none';
  update();
});
document.addEventListener('click',()=>{ $('pop').style.display='none'; });

/* ---------- live model --------------------------------------------------- */
function msg(s,ok){ const m=$('msg'); m.textContent=s; m.classList.toggle('ok',!!ok); }

function update(){
  const inp = readInput();
  if(!inp){ return false; }
  const {bc} = buildBC(inp);
  inp.bc = bc;
  try{
    const m = B.buildModel(inp);
    mdl = {Ltot:m.Ltot, xs:[0].concat(m.L.map((v,i,a)=>a.slice(0,i+1).reduce((s,x)=>s+x,0))),
           Phi:m.Phi, nm:m.nm, ndof:m.ndof, dL:m.dL, EL:m.EL, f:m.f, L:m.L};
    msg('');
  }catch(e){ msg(e.message,false); mdl=null; }
  drawBeam(); drawModes();
  $('bRep').disabled = $('bSave').disabled = runs.length===0;
  return !!mdl;
}

/* ---------- run ---------------------------------------------------------- */
async function doRun(){
  if(busy) return;
  if(!update()) return;
  const inp = readInput(); if(!inp) return;
  inp.bc = buildBC(inp).bc;
  busy = true; $('bRun').disabled = true;
  const t0 = performance.now();
  try{
    const out = await B.runAsync(inp, (fr,lab)=> msg(lab==='done'?'':lab, false));
    const lab = inp.load + (inp.load==='HSLM' ? '' : ' ×'+inp.N_car);
    runs.push({v:out.v, dmax:out.dmax, amax:out.amax, label:lab, inp});
    drawEnv('d'); drawEnv('a');
    msg(`done in ${((performance.now()-t0)/1000).toFixed(1)} s`, true);
    $('bRep').disabled = $('bSave').disabled = false;
  }catch(e){ msg(e.message,false); }
  busy = false; $('bRun').disabled = false;
}

/* ---------- excel export ------------------------------------------------- */
function runLabel(r,k){ return (k+1)+'. '+r.label; }
const r3 = v => (v===null||v===undefined||!isFinite(v)) ? null : Math.round(v*1e3)/1e3;

/**
 * Native "Save as" dialog where the browser has the File System Access API
 * (Chrome, Edge, Opera; needs https or localhost).  Elsewhere - Firefox,
 * Safari, or a file:// page - fall back to a download, which respects the
 * browser's own "always ask where to save" setting.
 * Returns false only if the user cancelled.
 */
async function saveBlob(blob, name, desc, mime, ext){
  if(window.showSaveFilePicker){
    try{
      const fh = await window.showSaveFilePicker({
        suggestedName: name,
        types: [{description: desc, accept: {[mime]: [ext]}}]
      });
      const w = await fh.createWritable();
      await w.write(blob);
      await w.close();
      return true;
    }catch(e){
      if(e.name === 'AbortError') return false;      // cancelled: do nothing
      // any other failure (e.g. insecure context) drops through to the anchor
    }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  return true;
}

async function exportXlsx(){
  if(!runs.length || !mdl){ msg('run first', false); return; }

  // mode shapes of the CURRENT model, on a refined grid (matches the plot).
  // Scaled to max|phi| = 1 as on screen, so these are NOT mass-normalised and
  // cannot be used to reconstruct response amplitudes.
  const xs=[];
  for(let x=0;x<=mdl.Ltot+1e-9;x+=mdl.dL/4) xs.push(Math.min(x,mdl.Ltot));
  const P = B.hermiteEvalMany(mdl.Phi, mdl.nm, mdl.ndof, mdl.dL, mdl.EL, xs);
  const mHead=['x (m)'], mCols=[xs.map(r3)];
  for(let n=0;n<mdl.nm;n++){
    const c = Array.from({length:xs.length},(_,j)=>P[n*xs.length+j]);
    let mx=0; c.forEach(v=>{ const a=Math.abs(v); if(a>mx) mx=a; });
    mCols.push(c.map(v => r3(v/mx)));
    mHead.push(`phi${n+1} (f = ${mdl.f[n].toFixed(2)} Hz)`);
  }

  // envelopes: union of all speeds, blanks where a run has no sample.
  // HSLM writes one column per train A1..A10 plus the envelope over them;
  // only the envelope columns are plotted.
  const vs = Array.from(new Set([].concat(...runs.map(r=>Array.from(r.v))))).sort((a,b)=>a-b);
  const maps = runs.map(r=>{ const m=new Map(); r.v.forEach((v,i)=>m.set(v,i)); return m; });
  const build = which => {
    const head=['v (km/h)'], cols=[vs.map(r3)], series=[];
    const sc = which==='d' ? 1e3 : 1;                  // dmax is stored in m
    runs.forEach((r,k)=>{
      const pre = runs.length>1 ? (k+1)+'. ' : '';
      const put = (label, get) => {
        cols.push(vs.map(v => maps[k].has(v) ? r3(get(maps[k].get(v))) : null));
        head.push(label);
        return cols.length-1;
      };
      if(r.inp.load==='HSLM'){
        const src = which==='d' ? r.dmax : r.amax;
        src.forEach((row,t)=> put(pre+'HSLM-A'+(t+1), i => row[i]*sc));
      }
      const e = env(r,which);
      const c = put(pre + (r.inp.load==='HSLM' ? 'HSLM envelope' : r.label), i => e[i]);
      series.push(c);                                   // only this one is plotted
    });
    return {head, cols, series};
  };
  const D = build('d'), A = build('a');

  const buf = XlsxOut.writeXlsx([
    {name:'Mode shapes', headers:mHead, cols:mCols,
     chart:{title:'Mode shapes', xlab:'x (m)', ylab:'Phi(x)'}},
    {name:'Displacement', headers:D.head, cols:D.cols, series:D.series,
     chart:{title:'Displacement envelope', xlab:'v (km/h)', ylab:'d_max (mm)'}},
    {name:'Acceleration', headers:A.head, cols:A.cols, series:A.series,
     chart:{title:'Acceleration envelope', xlab:'v (km/h)', ylab:'a_max (m/s2)'}}
  ]);

  const MIME = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  const name = 'BeamDyn2D_' + new Date().toISOString().slice(0,10) + '.xlsx';
  try{
    const done = await saveBlob(new Blob([buf],{type:MIME}), name, 'Excel workbook', MIME, '.xlsx');
    msg(done ? 'saved' : '', !!done);
  }catch(e){ msg(e.message, false); }
}

/* ---------- report ------------------------------------------------------- */
function buildReport(){
  const t = $('rep'); t.innerHTML='';
  if(!runs.length || !mdl) return;
  const r = runs[runs.length-1], I = r.inp;
  const row = (cells,cls)=>{ const tr=t.insertRow();
    cells.forEach(c=>{ const td=tr.insertCell(); td.textContent=c; if(cls) td.className=cls; }); };
  row(['Input','','Results',''],'h');
  const de = env(r,'d'), ae = env(r,'a');
  let di=0,ai=0; de.forEach((v,i)=>{ if(v>de[di]) di=i; }); ae.forEach((v,i)=>{ if(v>ae[ai]) ai=i; });
  const sup_ = sup.some(Boolean) ? `${sup.filter(Boolean).length} of ${sup.length} clamped` : 'all pinned';
  const rows = [
    ['L (m)', mdl.L.join('+'),            'peak displacement', `${de[di].toFixed(2)} mm at ${r.v[di]} km/h`],
    ['m (kg/m)', String(I.m),             'peak acceleration', `${ae[ai].toFixed(3)} m/s² at ${r.v[ai]} km/h`],
    ['EI (Nm²)', I.EI.toExponential(2),   'f (Hz)', mdl.f.map(v=>v.toFixed(2)).join(', ')],
    ['ξ (%)', String(I.xi),               'supports', sup_],
    ['load / cars', I.load + (I.load==='HSLM'?'':' × '+I.N_car), 'model', `${mdl.EL} elements, dL = ${I.dL} m`],
    ['v (km/h)', $('iv').value,           'date', new Date().toISOString().slice(0,16).replace('T',' ')],
    ['W (m)', String(I.W),                '', '']
  ];
  rows.forEach(c=>row(c));
}

['HSLM'].concat(B.LINE_CAT.name).forEach(n=>{
  const o=document.createElement('option'); o.value=n; o.textContent=n; sel.appendChild(o); });
sel.value = DEF.load;

['iL','im','iEI','ixi','iNmod','ifmax','idL','iNcar','iv','iW']
  .forEach(id => $(id).addEventListener('input', update));
sel.addEventListener('change', update);

$('bRun').addEventListener('click', doRun);
$('bClear').addEventListener('click', ()=>{ runs=[]; picks=[]; drawEnv('d'); drawEnv('a');
  msg(''); $('bRep').disabled = $('bSave').disabled = true; });
$('bReset').addEventListener('click', ()=>{
  $('iL').value=DEF.L; $('im').value=DEF.m; $('iEI').value=DEF.EI; $('ixi').value=DEF.xi;
  $('iNmod').value=DEF.Nmod; $('ifmax').value=DEF.fmax; $('idL').value=DEF.dL;
  sel.value=DEF.load; $('iNcar').value=DEF.Ncar; $('iv').value=DEF.v; $('iW').value=DEF.W;
  sup=[]; runs=[]; picks=[]; drawEnv('d'); drawEnv('a'); update(); msg('');
});
$('bSave').addEventListener('click', exportXlsx);
$('bRep').addEventListener('click', ()=>{ buildReport(); window.print(); });

update(); drawEnv('d'); drawEnv('a');
</script>
